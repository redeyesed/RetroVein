plugins {
    id 'java'
}

group = 'com.red.retrovein'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm-all:5.0.3'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.red.retrovein.RetroVein'
        )
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
	options.release.set(8)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
